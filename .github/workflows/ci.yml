name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: remitrelief
          POSTGRES_PASSWORD: remitrelief_test
          POSTGRES_DB: remitrelief_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remitrelief -d remitrelief_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: remitrelief-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: remitrelief-backend/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          NODE_ENV: development
          DEMO_MODE: "true"
          STELLAR_NETWORK: TESTNET
          STORE_DRIVER: json
      - run: npm run prisma:validate
        env:
          DATABASE_URL: postgresql://remitrelief:remitrelief_test@localhost:5432/remitrelief_test
      - run: npm run prisma:migrate
        env:
          DATABASE_URL: postgresql://remitrelief:remitrelief_test@localhost:5432/remitrelief_test
      - run: npm run test:db
        env:
          NODE_ENV: test
          STORE_DRIVER: prisma
          STELLAR_NETWORK: TESTNET
          AUTH_SESSION_SECRET: ci-phase4-session-secret
          DATABASE_URL: postgresql://remitrelief:remitrelief_test@localhost:5432/remitrelief_test

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remitrelief-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: remitrelief-frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  escrow-contract-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remitrelief-backend/src/contracts/escrow-contract
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            remitrelief-backend/src/contracts/escrow-contract/target
          key: ${{ runner.os }}-escrow-${{ hashFiles('remitrelief-backend/src/contracts/escrow-contract/Cargo.lock') }}
      - name: Run contract tests
        run: cargo test
